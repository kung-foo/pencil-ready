# Supply-chain hygiene: block dependency versions that were published
# less than two weeks ago. Buys time for a malicious or compromised
# release to be caught and yanked before it lands in our lockfile.
# Value is in minutes; 20160 = 14 * 24 * 60.
minimumReleaseAge: 20160
#
# If an install is ever blocked by a fresh optional binary, add a
# version-pinned `minimumReleaseAgeExclude` entry rather than a family
# glob — and put it here, not in .npmrc: `minimum-release-age-exclude`
# in .npmrc silently disables the cooldown for every package.
