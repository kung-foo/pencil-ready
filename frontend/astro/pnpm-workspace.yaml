# Supply-chain hygiene: block dependency versions that were published
# less than two weeks ago. Buys time for a malicious or compromised
# release to be caught and yanked before it lands in our lockfile.
# Value is in minutes; 20160 = 14 * 24 * 60.
minimumReleaseAge: 20160

# Rollup ships ~20 per-platform optional binaries (one per OS/arch/libc
# combination); pnpm checks every one against minimumReleaseAge even
# though only the host's binary ever installs. Excluding the family
# lets fresh installs proceed without loosening the global maturity
# policy. The host binary itself is still pinned via the lockfile.
# Must live here, not in .npmrc: `minimum-release-age-exclude` in
# .npmrc silently disables the cooldown for every package.
minimumReleaseAgeExclude:
  - "@rollup/rollup-*"
